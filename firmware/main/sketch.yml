profiles:
  esp32s3_dev_module:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=custom,PSRAM=opi
    platforms:
      - platform: esp32:esp32 (3.3.2)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - Adafruit BNO055 (1.6.4)
      - Adafruit LSM6DS (4.7.4)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit GFX Library (1.12.4)
      - Adafruit GC9A01A (1.1.1)
      - Adafruit BusIO (1.17.4)
      - Adafruit MAX1704X (1.0.3)

default_profile: esp32s3_dev_module
